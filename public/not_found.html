<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#x2730; ERROR 404 &#x2730;</title>

    <style>
      * {
        cursor: url("/WEBSITE/cursor.png"), auto !important;
      }

      body {
        background-image: url("/WEBSITE/ERROR_404/slendybg.gif");
      }

      @font-face {
        font-family: "slendy";
        src:
          url("/WEBSITE/ERROR_404/slendy.ttf") format("truetype"),
          url("/WEBSITE/slendy.woff") format("woff");
      }

      h1 {
        font-family: "slendy";
        z-index: 1;
        color: red;
      }

      h2 {
        font-family: "slendy";
        font-size: 150px;
        z-index: 1;
        color: red;
      }

      h3 {
        font-family: "slendy";
        font-size: 80px;
        z-index: 1;
        color: red;
      }

      p {
        font-family: "Comic Sans MS", cursive;
        z-index: 1;
        color: red;
        font-size: 50px;
      }
    </style>
  </head>

  <body>
    <div style="text-align: center">
      <h2>ERROR 404</h2>
      <h3>YOU ARE NOT WELCOME HERE</h3>
    </div>

    <br />

    <p>* P.S: graphic design is my passion</p>

    <audio
      autoplay
      controls
      id="myAudio"
      loop
      style="width: 0.1%; height: 0.1%"
    >
      <source src="/WEBSITE/ERROR_404/milkyway_cherry_coke.mp3" />
    </audio>

    <script>
      document.addEventListener("visibilitychange", function () {
        const audio = document.getElementById("myAudio");

        if (document.hidden) {
          audio.pause();
        } else {
          audio.play();
        }
      });
    </script>
  </body>
</html>
