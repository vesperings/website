<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />

    <title>Poptropica</title>

    <style>
      @font-face {
        font-family: creativeblockbb;
        src: url("/WEBSITE/SHRINES/POPTROPICA/CREABBB_.TTF");
      }

      @font-face {
        font-family: storychoice;
        src: url("/WEBSITE/SHRINES/POPTROPICA/Story%20Choice%20Sans%20Serif.ttf");
      }

      body {
        background-color: #139ffd;
        margin: 0;
      }

      h1 {
        font-family: "creativeblockbb";
        z-index: 1;
        color: goldenrod;
      }

      p {
        font-family: "storychoice";
        z-index: 1;
        color: black;
      }

      * {
        cursor: url("/WEBSITE/SHRINES/POPTROPICA/cursor.svg"), auto !important;
      }

      #map {
        position: absolute;
        top: calc(550 / 936 * 100vh);
        left: calc(450 / 1707 * 100vw);
        max-width: 50vw;
      }
    </style>
  </head>

  <body>
    <svg
      style="width: 100%; height: auto"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 0 1025 731"
      preserveAspectRatio="xMidYMid meet"
    >
      <style>
        .image-mapper-shape {
          fill: rgba(0, 0, 0, 0);
        }

        g:hover .image-mapper-shape {
          stroke: white;
          stroke-width: 2px;
          opacity: 20%;
        }
      </style>

      <image
        xlink:href="/WEBSITE/SHRINES/POPTROPICA/bg.svg"
        width="1025"
        height="731"
      />

      <a
        xlink:href="/shrines/poptropica/blog"
        target="_blank"
        xlink:title="Pop Blog"
      >
        <g>
          <circle
            cx="658"
            cy="72"
            r="25.942243542145693"
            class="image-mapper-shape"
            data-index="1"
          />
        </g>
      </a>
    </svg>

    <div id="map">
      <h1>THIS PAGE IS CURRENTLY UNDER CONSTRUCTION. COME BACK SOON!</h1>
    </div>

    <audio
      autoplay
      controls
      id="myAudio"
      loop
      style="width: 0.1%; height: 0.1%"
      volume="0.3"
    >
      <source
        src="/WEBSITE/SHRINES/POPTROPICA/jeff_heim_poptropica_overture.mp3"
        type="audio/mpeg"
      />
    </audio>

    <script>
      document.addEventListener("visibilitychange", function () {
        const audio = document.getElementById("myAudio");

        if (document.hidden) {
          audio.pause();
        } else {
          audio.play().catch(function (error) {
            console.log("Audio playback was prevented:", error);
          });
        }
      });
    </script>

    <div
      style="
        max-height: 150px;
        position: fixed;
        left: 30px;
        bottom: 0;
        z-index: 400;
      "
    >
      <img src="/POPTROPICA/popslendy.gif" width="150" alt="" />
    </div>
  </body>
</html>
