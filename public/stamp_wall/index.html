<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#9734; STAMP WALL &#9734;</title>

    <style>
      body {
        background-image: url("wallpaper.jpg");
        background-repeat: repeat;
        background-attachment: fixed;
      }

      .bus {
        text-align: center;
      }

      * {
        cursor:
          url("https://file.garden/Z_RjuJFUvSUt-EAj/WEBSITE/cursor.png"), auto !important;
      }

      .lets {
        text-align: center;
        font-family: Arial, sans-serif;
      }

      .mainbox {
        margin-left: auto;
        margin-right: auto;
        width: 67%;
        height: 700px;
        border: 0 solid #000;
        padding: 0;
        bottom: 50px;
      }

      .header {
        height: 121px;
        text-align: center;
        margin-top: 30px;
        margin-bottom: 30px;
      }

      .stamps {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
      }

      .buttons {
        text-align: center;
      }

      .blinkies {
        text-align: center;
      }

      .other {
        text-align: center;
      }

      ::-webkit-scrollbar {
        width: 7px;
        height: 0;
      }

      ::-webkit-scrollbar-corner {
        background: #c79dff;
      }

      ::-webkit-scrollbar-track {
        background: #000;
      }

      ::-webkit-scrollbar-thumb {
        background: #4b0101;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #4b0101;
      }

      a:link {
        color: red;
      }

      a:visited {
        color: red;
      }

      a:hover {
        color: red;
      }

      a:active {
        color: red;
      }

      .blinkies img {
        padding: 4px;
      }

      .buttons img {
        padding: 4px;
      }
    </style>
  </head>

  <body>
    <audio
      id="myAudio"
      autoplay
      controls
      loop
      style="width: 0.1%; height: 0.1%"
    >
      <source src="/WEBSITE/STAMP_WALL/xoxokisseshugs.mp3" />
    </audio>

    <script>
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          document.getElementById("myAudio").pause();
        } else {
          document.getElementById("myAudio").play();
        }
      });
    </script>

    <div class="mainbox">
      <div class="header">
        <img src="stamps.gif" height="100" alt="" />
        <p><br /></p>
      </div>

      <div class="stamps">
        <script>
          for (let i = 1; i <= 100; i++) {
            const img = document.createElement("img");
            img.src = `s${i}.gif`;
            img.alt = "";
            document.currentScript.parentElement.appendChild(img);
          }
        </script>
      </div>

      <div class="header">
        <img src="blinkies.gif" height="100" alt="" />
        <p><br /></p>
      </div>

      <div class="blinkies">
        <script>
          for (let i = 1; i <= 100; i++) {
            const img = document.createElement("img");
            img.src = `bl${i}.gif`;
            img.alt = "";
            document.currentScript.parentElement.appendChild(img);
          }
        </script>
      </div>

      <div class="header">
        <img src="buttons.gif" height="100" alt="" />
        <p><br /></p>
      </div>

      <div class="buttons">
        <script>
          for (let i = 1; i <= 100; i++) {
            const img = document.createElement("img");
            img.src = `b${i}.gif`;
            img.alt = "";
            document.currentScript.parentElement.appendChild(img);
          }
        </script>
      </div>

      <div class="header">
        <img src="other.gif" height="100" alt="" />
        <p><br /></p>
      </div>

      <div class="other">
        <a href="https://www.springhole.net/quizzes/fantasycreature/index.html">
          <img src="1.gif" alt="" />
        </a>

        <a
          href="https://www.theotaku.com/quizzes/view/291/what_type_of_anime_girl_are_you"
        >
          <img src="2.gif" alt="" />
        </a>

        <a
          href="https://emocowboy.neocities.org/?emo=/home/tests/oral_piercing"
        >
          <img src="3.gif" alt="" />
        </a>

        <a href="https://emocowboy.neocities.org/home/tests/how_emo_test">
          <img src="4.gif" alt="" />
        </a>

        <script>
          for (let i = 5; i <= 100; i++) {
            const img = document.createElement("img");
            img.src = `${i}.gif`;
            img.alt = "";
            document.currentScript.parentElement.appendChild(img);
          }
        </script>
      </div>

      <p><br /></p>

      <div class="back"></div>
    </div>
  </body>
</html>
