  <body>
    <!-- You can put your own content up here.
        You can move the dollmaker on the page using CSS
        (see mainstylesheet.css for details). -->

    <audio
      autoplay
      controls
      id="myAudio"
      loop
      style="width: 0.1%; height: 0.1%"
    >
      <source
        src="/WEBSITE/FASHION/DOLLMAKER/barbie_you_can_tell_shes_a_princess_instrumental.mp3"
      />
    </audio>

    <script>
      const audio = document.getElementById("myAudio");
      audio.volume = 0.3;

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          audio.pause();
        } else {
          audio.play();
        }
      });
    </script>

      </div>

      <div id="swatchesArea" class="ui-corner-all">
        <!-- **EDIT HERE**
              On each line, in the <a href=""> tag, put the URL

              In the <img src=""> tag, put the URL of the thumbnail.

      </div>
